default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "postgres" } %>

development:
  <<: *default
  database: email_processor_development

test:
  <<: *default
  database: email_processor_test

production:
  primary: &primary_production
    <<: *default
    database: tech_test_desenvolvedor_pleno_production
    username: tech_test_desenvolvedor_pleno
    password: <%= ENV["TECH_TEST_DESENVOLVEDOR_PLENO_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: tech_test_desenvolvedor_pleno_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: tech_test_desenvolvedor_pleno_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: tech_test_desenvolvedor_pleno_production_cable
    migrations_paths: db/cable_migrate
